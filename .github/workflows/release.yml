name: Automated Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract tag and version
        id: get_version
        shell: powershell
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG.TrimStart('v').TrimStart('V')
          echo "TAG=$TAG" >> $env:GITHUB_ENV
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          Write-Host "Extracted Version: $VERSION for Tag: $TAG"

      - name: Build and Publish .NET Application
        shell: powershell
        run: |
          dotnet publish DocumentSearch/DocumentSearch.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$env:VERSION `
            -o ./publish

          # Create versioned copy (e.g. v2.2.3.exe) alongside DocumentSearch.exe
          Copy-Item "./publish/DocumentSearch.exe" "./publish/$env:TAG.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./publish/DocumentSearch.exe
            ./publish/${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
